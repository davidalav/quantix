name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-on-minikube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests
        run: |
          docker run --rm -v "$PWD/k8s:/k8s" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas /k8s

      - name: Start minikube
        uses: medyagh/setup-minikube@v0.0.19   # проверь актуальный релиз и закрепи версию
        with:
          driver: docker

      - name: Build images inside minikube
        run: |
          eval "$(minikube docker-env)"
          docker build -t quantix-backend:ci backend
          docker build -t quantix-frontend:ci \
            --build-arg NEXT_PUBLIC_API_URL=http://api.quantix.local frontend

      - name: Deploy
        run: |
          cp -r k8s /tmp/k8s
          sed -i -E 's|image: quantix-backend:.*|image: quantix-backend:ci|'   /tmp/k8s/10-backend.yaml
          sed -i -E 's|image: quantix-frontend:.*|image: quantix-frontend:ci|' /tmp/k8s/20-frontend.yaml

          kubectl apply -f /tmp/k8s/00-namespace.yaml
          kubectl apply -f /tmp/k8s/05-resourcequota.yaml
          kubectl create secret generic postgres-credentials -n quantix \
            --from-literal=POSTGRES_PASSWORD=quantix

          kubectl apply -f /tmp/k8s/30-postgress.yaml
          kubectl rollout status deploy/postgres -n quantix --timeout=180s
          kubectl apply -f /tmp/k8s/10-backend.yaml
          kubectl rollout status deploy/backend -n quantix --timeout=240s
          kubectl apply -f /tmp/k8s/20-frontend.yaml
          kubectl rollout status deploy/frontend -n quantix --timeout=180s

      - name: Smoke test
        run: |
          kubectl port-forward -n quantix svc/backend-service 8000:8000 &
          kubectl port-forward -n quantix svc/frontend-service 3000:3000 &
          sleep 5
          curl -fsS http://localhost:8000/health
          curl -fsSI http://localhost:3000/

      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods,events -n quantix
          kubectl logs -n quantix -l app=backend --tail=50 --all-containers || true