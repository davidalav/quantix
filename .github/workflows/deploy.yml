name: quantix-CD

on:
  workflow_run:
    workflows: ["quantix-CI"]
    types:
      - completed
    branches:
      - main

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev

      - name: Get short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            us-east1-docker.pkg.dev/quantix-prod/quantix/backend:latest
            us-east1-docker.pkg.dev/quantix-prod/quantix/backend:git-${{ steps.vars.outputs.short_sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            us-east1-docker.pkg.dev/quantix-prod/quantix/frontend:latest
            us-east1-docker.pkg.dev/quantix-prod/quantix/frontend:git-${{ steps.vars.outputs.short_sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          # Получаем короткий хэш коммита
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          
          # Оборачиваем в одинарные кавычки, чтобы переменная SHORT_SHA подставилась на стороне GitHub Actions
          ssh -o IdentitiesOnly=yes -o PubkeyAcceptedKeyTypes=+ssh-ed25519 -i ~/.ssh/id_ed25519 davidalaverdyan0@${{ secrets.SERVER_IP }} "
            set -euo pipefail
            cd ~/quantix
            
            echo 'Cleaning up old docker images...'
            docker system prune -a --volumes -f || true
            
            echo 'Pulling new images with TAG=git-${SHORT_SHA}...'
            export TAG=git-${SHORT_SHA}
            docker compose pull
            
            echo 'Starting containers...'
            docker compose up -d --force-recreate
            
            echo 'Deployment complete.'
          "
