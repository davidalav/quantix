{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "myapp.resourceName" (dict "context" . "suffix" "db-secret") }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  SECRET_KEY: {{ .Values.database.secretKey | quote }}
  DB_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.database.user (.Values.database.password | urlquery) (include "myapp.resourceName" (dict "context" . "suffix" "postgres-service")) .Values.database.port .Values.database.name | quote }}
{{- end }}
