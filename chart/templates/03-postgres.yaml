apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myapp.resourceName" (dict "context" . "suffix" "postgres") }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "myapp.dbSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "myapp.dbSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.database.port }}
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "myapp.resourceName" (dict "context" . "suffix" "config") }}
                  key: DB_NAME
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "myapp.resourceName" (dict "context" . "suffix" "db-secret")) .Values.database.existingSecret }}
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.user | quote }}
                - -d
                - {{ .Values.database.name | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: {{ include "myapp.resourceName" (dict "context" . "suffix" "postgres-data") }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "myapp.resourceName" (dict "context" . "suffix" "postgres-data") }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.database.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myapp.resourceName" (dict "context" . "suffix" "postgres-service") }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "myapp.dbSelectorLabels" . | nindent 4 }}
