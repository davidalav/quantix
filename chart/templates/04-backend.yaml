apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myapp.resourceName" (dict "context" . "suffix" "backend") }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "myapp.backendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "myapp.backendSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "myapp.resourceName" (dict "context" . "suffix" "config") }}
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "myapp.resourceName" (dict "context" . "suffix" "db-secret")) .Values.database.existingSecret }}
                  key: DB_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "myapp.resourceName" (dict "context" . "suffix" "db-secret")) .Values.database.existingSecret }}
                  key: SECRET_KEY
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.healthPath | quote }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.healthPath | quote }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myapp.resourceName" (dict "context" . "suffix" "backend-service") }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "myapp.backendSelectorLabels" . | nindent 4 }}
