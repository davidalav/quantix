version: "3.9"

services:
  db:
    image: postgres:15
    container_name: quantix-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quantix
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: quantix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantix -d quantix"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

volumes:
  db_data:
