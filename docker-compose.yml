services:
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://${{ secrets.SERVER_IP }}:8000
    container_name: quantix-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://${{ secrets.SERVER_IP }}:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: quantix-backend
    ports:
      - "8000:8000"
    env:
      - DB_URL: ${{ secrets.DB_URL }}
      - SECRET_KEY: ${{ secrets.SECRET_KEY }}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:15
    container_name: quantix-db
    environment:
      POSTGRES_USER: quantix
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: quantix
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantix -d quantix"]
      interval: 3s
      timeout: 3s
      retries: 10