version: "3.9"

services:
  nginx:
    image: nginx:latest
    container_name: quantix-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

  frontend:
    image: us-east1-docker.pkg.dev/quantix-505516/quantix/frontend:latest
    container_name: quantix-frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api

  backend:
    image: us-east1-docker.pkg.dev/quantix-505516/quantix/backend:latest
    container_name: quantix-backend
    environment:
      - DB_URL=postgresql://quantix:secret@$${DB_SERVER_IP}:5432/quantix
      - SECRET_KEY=${SECRET_KEY}
    restart: on-failure
