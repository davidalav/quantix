services:
  frontend:
    build:
      context: ./frontend
    container_name: quantix-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://34.139.163.84:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: quantix-backend
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql://quantix:secret@db:5432/quantix
      - SECRET_KEY=b0d7131c028d602e415a87456198c11c69d3ff2f0e1672141c0b926f18080657
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:15
    container_name: quantix-db
    environment:
      POSTGRES_USER: quantix
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: quantix
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantix -d quantix"]
      interval: 3s
      timeout: 3s
      retries: 10