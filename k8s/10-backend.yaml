apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: quantix
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: quantix-backend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CORS_ORIGINS
              value: "http://app.quantix.local,http://localhost:3000"
            - name: DB_URL
              value: "postgresql://quantix:quantix@postgres-service:5432/quantix"
            - name: SECRET_KEY
              value: "dev-secret-key-change-me"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: quantix
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000