apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: quantix
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: quantix-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_URL
              value: "postgresql://quantix:quantix@quantix-postgres:5432/quantix"
            - name: SECRET_KEY
              value: "dev-secret-key-change-me"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: quantix
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000