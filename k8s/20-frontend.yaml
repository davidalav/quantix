apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: quantix
  labels:
    app: frontend
spec:
  containers:
    - name: frontend
      image: quantix-frontend:v1
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3000
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://backend-service:8000"

---

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: quantix
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000